<style>
:root{--bg:#f4f6fb;--tx:#14213d;--mu:#667085;--cd:#fff;--bd:#d6dbe6;--ac:#1d4ed8;--rd:#d92d20;--go:#c8921a}
@media(prefers-color-scheme:dark){:root{--bg:#0d1424;--tx:#e8ecf5;--mu:#97a0b3;--cd:#161f35;--bd:#2a3550;--ac:#6b93ff;--rd:#ff7b72;--go:#f0b84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.hd img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#000;flex:none}
.hd div{min-width:0}
h1{font:800 24px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.3px}
h1 em{color:var(--go);font-style:normal}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button,a.bt{display:inline-block;padding:10px 14px;border:1px solid var(--ac);border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;margin:3px 0;text-decoration:none;cursor:pointer}
button.s{background:transparent;color:var(--ac)}
button.x{background:transparent;color:var(--rd);border-color:var(--rd)}
.mu{color:var(--mu);font-size:14px}
label{font-size:14px;color:var(--mu)}
.row{display:flex;gap:6px;align-items:center}.row input{margin:0}
.exe{padding:6px 0;border-top:1px solid var(--bd)}.exe>input{margin:2px 0 6px}
.ex2{padding:10px 0;border-top:1px solid var(--bd)}.ex2 .row{margin-top:6px}
.ex2.done .nm{text-decoration:line-through;opacity:.55}
.ok{display:flex;align-items:center;gap:10px;margin:8px 0 0;font-size:16px;color:var(--tx);cursor:pointer}
.ok input{width:26px;height:26px;margin:0;accent-color:var(--ac)}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;color:#fff;background:var(--ac)}
.tg.g{background:var(--go);color:#111}.tg.r{background:var(--rd)}
.b{padding:8px 12px;border-radius:14px;margin:4px 0;max-width:85%;width:fit-content}
.me{background:var(--ac);color:#fff;margin-left:auto}.ot{background:var(--bd)}
#ch{max-height:240px;overflow:auto;margin-bottom:8px}
#tt{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;max-width:90%}
</style></head><body>
<div id="app"><p class="mu">Cargando…</p></div><div id="tt"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAHeWt3yOcpGx8UacxHr5HJPlN7FA2feQQ",authDomain:"bluehorse-gym.firebaseapp.com",projectId:"bluehorse-gym",storageBucket:"bluehorse-gym.firebasestorage.app",messagingSenderId:"240476420168",appId:"1:240476420168:web:133e368e1930e0daca807d"});
const sec=firebase.initializeApp(firebase.app().options,"sec");
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s),app=$("#app");
const ADMIN="guillegori760@gmail.com";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nz=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const LOGO=$("#ic").href;document.head.insertAdjacentHTML("beforeend",`<link rel="apple-touch-icon" href="${LOGO}">`);
const hdr=(t,s)=>`<div class="hd"><img src="${LOGO}" alt=""><div><h1>${t}</h1>${s?`<div class="mu">${s}</div>`:""}</div></div>`;
let U=[],cur={},unl=null,delArm=null,logs=[],msgs=[],ROLE=null,PN="",F="all";
const DAY=864e5,dias=c=>(Date.now()-(c.visto||c.desde||0))/DAY,ina=c=>dias(c)>=60,due=c=>(Date.now()-(c.ultCons||c.desde||0))/DAY>=30,unr=c=>(c.ultMsgC||0)>(c.leidoP||0);
const clr=()=>{U.forEach(u=>u());U=[]},sub=u=>U.push(u);
const rst=()=>{clr();app.onclick=app.oninput=app.onchange=null};
function toast(m){const t=$("#tt");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3000)}
const hashId=()=>(location.hash.match(/^#c=([\w-]+)/)||[])[1];
const isCoach=u=>u&&!u.isAnonymous;
const base=()=>location.href.split("#")[0];
function route(u){clr();const id=hashId();
 if(id){if(!u)auth.signInAnonymously().catch(e=>app.innerHTML="<p>No se pudo conectar: "+esc(e.message)+"</p>");else clientView(id)}
 else if(isCoach(u))enter(u);else login()}
auth.onAuthStateChanged(route);window.onhashchange=()=>route(auth.currentUser);
async function enter(u){ROLE=null;
 if((u.email||"").toLowerCase()===ADMIN){ROLE="admin";PN="Administrador"}
 else{try{const s=await db.collection("profs").doc(u.uid).get();if(s.exists){ROLE="prof";PN=s.data().nombre}}catch(e){}}
 if(ROLE)return coachHome();
 rst();app.innerHTML=hdr("Sin acceso")+`<div class="cd"><p>Tu usuario todavía no tiene permiso. Pedile acceso al administrador.</p><button class="s" id="out">Salir</button></div>`;$("#out").onclick=()=>auth.signOut()}

function login(){rst();
 app.innerHTML=hdr("Blue Horse <em>Gym</em>","Ingreso de profes")+`<div class="cd"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="go">Entrar</button> <button class="s" id="fg">Olvidé mi contraseña</button><div id="er" class="mu" style="color:var(--rd)"></div></div>`;
 $("#go").onclick=()=>auth.signInWithEmailAndPassword($("#em").value.trim(),$("#pw").value).catch(()=>$("#er").textContent="Email o contraseña incorrectos.");
 $("#fg").onclick=()=>{const e=$("#em").value.trim();if(!e)return toast("Escribí tu email arriba");auth.sendPasswordResetEmail(e).then(()=>toast("Te enviamos un email para cambiarla")).catch(x=>toast(x.message))}}

async function delClient(id){const ref=db.collection("clients").doc(id),r=[];
 for(const n of["logs","msgs"])(await ref.collection(n).get()).forEach(x=>r.push(x.ref));r.push(ref);
 for(let i=0;i<r.length;i+=400){const bt=db.batch();r.slice(i,i+400).forEach(x=>bt.delete(x));await bt.commit()}}

function coachHome(){rst();let cl=[];const adm=ROLE==="admin";
 app.innerHTML=hdr("Mis clientes",esc(PN)+(adm?" · Admin":""))+`<div id="st" class="mu"></div><div id="fl" style="margin:8px 0"></div><button id="nw">+ Nuevo cliente</button> ${adm?'<button class="s" id="pf">Profes</button> ':""}<button class="s" id="bp">Copia (CSV)</button><input id="sq" placeholder="Buscar cliente" autocomplete="off" style="margin-top:10px"><div id="ls"></div><button class="s" id="out">Salir</button>`;
 const paint=()=>{const a=cl.filter(c=>!ina(c)).length,i=cl.length-a,d=cl.filter(due).length,v=nz($("#sq").value);
  $("#st").textContent=`Rutinas: ${cl.length} · Activas: ${a} · Inactivas (+60 días sin abrir): ${i}`;
  $("#fl").innerHTML=[["all","Todos"],["act","Activas"],["ina","Inactivas ("+i+")"],["due","🔔 Consultar ("+d+")"]].map(([k,l])=>`<button class="${F===k?"":"s"}" data-f="${k}">${l}</button>`).join(" ")+(F==="ina"&&i?` <button class="x" id="pg">Eliminar las ${i} inactivas</button>`:"");
  const L=cl.filter(c=>(F==="all"||(F==="act"&&!ina(c))||(F==="ina"&&ina(c))||(F==="due"&&due(c)))&&(!v||nz([c.nombre,c.objetivo,c.cel,c.profNombre].join(" ")).includes(v))).sort((x,y)=>String(x.nombre).localeCompare(String(y.nombre)));
  $("#ls").innerHTML=L.map(c=>`<div class="cd" data-o="${esc(c.id)}" style="cursor:pointer"><b>${esc(c.nombre||"(sin nombre)")}</b>${due(c)?'<span class="tg g">🔔 Consultar</span>':""}${ina(c)?'<span class="tg r">💤 '+Math.floor(dias(c))+' días</span>':""}${unr(c)?'<span class="tg">💬 Nuevo</span>':""}<div class="mu">${esc(c.objetivo||"")}${adm?" · Profe: "+esc(c.profNombre||"-"):""}</div></div>`).join("")||'<p class="mu">No hay clientes en esta vista.</p>'};
 const q=adm?db.collection("clients"):db.collection("clients").where("prof","==",auth.currentUser.uid);
 sub(q.onSnapshot(s=>{cl=s.docs.map(d=>({...d.data(),id:d.id}));paint()},e=>toast(e.message)));
 $("#sq").oninput=paint;
 $("#nw").onclick=()=>editor(db.collection("clients").doc().id);
 $("#out").onclick=()=>auth.signOut();
 if(adm)$("#pf").onclick=profsView;
 $("#bp").onclick=async()=>{const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';const rows=["Cliente,Fecha,Ejercicio,Kg,Reps"];
  for(const c of cl){const s=await db.collection("clients").doc(c.id).collection("logs").orderBy("t").get();s.forEach(d=>{const l=d.data();rows.push([c.nombre,new Date(l.t).toISOString().slice(0,10),l.n,l.kg,l.reps].map(q).join(","))})}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv"}));a.download="bluehorse-backup.csv";a.click()};
 app.onclick=async e=>{const b=e.target.closest("button"),c=e.target.closest("[data-o]");
  if(b&&b.dataset.f){F=b.dataset.f;delArm=null;return paint()}
  if(b&&b.id==="pg"){const n=cl.filter(ina);if(delArm!=="pg"){delArm="pg";b.textContent="¿Seguro? Se borran "+n.length+". Tocá otra vez";return}
   delArm=null;try{for(const x of n)await delClient(x.id);toast("Eliminadas "+n.length)}catch(err){toast(err.message)}return}
  if(!b&&c)editor(c.dataset.o)}}

function profsView(){rst();let ps=[];
 app.innerHTML=`<button class="s" id="bk">← Clientes</button>`+hdr("Profes","Acceso para crear rutinas")+`<div class="cd"><b>Nuevo profe</b><input id="pn1" placeholder="Nombre"><input id="pe1" type="email" placeholder="Email"><input id="pw1" placeholder="Contraseña (mínimo 6)"><button id="mk">Crear profe</button><div id="mr"></div></div><div id="pl"></div>`;
 sub(db.collection("profs").onSnapshot(s=>{ps=s.docs.map(d=>d.data());$("#pl").innerHTML=ps.map(p=>`<div class="cd"><b>${esc(p.nombre)}</b><div class="mu">${esc(p.email)}</div><button class="x" data-rp="${esc(p.uid)}">Quitar acceso</button></div>`).join("")||'<p class="mu">Todavía no hay profes.</p>'}));
 app.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  try{
  if(b.id==="bk")return coachHome();
  if(d.rp){if(delArm!==d.rp){delArm=d.rp;b.textContent="¿Seguro? Tocá otra vez";return}delArm=null;await db.collection("profs").doc(d.rp).delete();toast("Acceso quitado")}
  if(b.id==="mk"){const n=$("#pn1").value.trim(),em=$("#pe1").value.trim().toLowerCase(),pw=$("#pw1").value;if(!n||!em||pw.length<6)return toast("Completá nombre, email y contraseña (mínimo 6)");
   const c=await sec.auth().createUserWithEmailAndPassword(em,pw);await sec.auth().signOut();await db.collection("profs").doc(c.user.uid).set({uid:c.user.uid,nombre:n,email:em,t:Date.now()});
   const msg=`Hola ${n}! Ya podés crear rutinas en Blue Horse Gym. Entrá a ${base()} con tu email ${em} y la contraseña ${pw}`;
   $("#mr").innerHTML=`<div class="cd"><a class="bt" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Enviar por WhatsApp</a> <button class="s" id="cp">Copiar mensaje</button></div>`;
   $("#cp").onclick=()=>navigator.clipboard.writeText(msg).then(()=>toast("Copiado"))}
  }catch(err){toast(err.message)}}}

function editor(id){rst();logs=[];msgs=[];const ref=db.collection("clients").doc(id);
 ref.get().then(s=>{cur=s.exists?{...s.data()}:{nombre:"",cel:"",objetivo:"",pin:"",profNombre:PN,days:[{t:"Día 1",ex:[]}],desde:Date.now()};cur.id=id;
  sub(ref.collection("logs").orderBy("t","desc").limit(30).onSnapshot(s=>{logs=s.docs.map(d=>d.data());paintLg()},()=>{}));
  sub(ref.collection("msgs").orderBy("t").onSnapshot(s=>{msgs=s.docs.map(d=>d.data());paintM("p");const l=msgs[msgs.length-1];
   if(l&&l.from==="c"&&l.t>(cur.leidoP||0)){cur.leidoP=Date.now();ref.update({leidoP:cur.leidoP}).catch(()=>{})}},()=>{}));
  draw(ref)}).catch(e=>toast(e.message))}
function paintLg(){const el=$("#lg");if(el)el.innerHTML=logs.map(l=>`<div class="mu">${new Date(l.t).toLocaleDateString("es-AR")} · ${esc(l.n)}: ${esc(l.kg||"-")} kg × ${esc(l.reps||"-")}</div>`).join("")||'<div class="mu">Todavía no cargó pesos.</div>'}
function paintM(me){const el=$("#ch");if(!el)return;el.innerHTML=msgs.map(m=>`<div class="b ${m.from===me?"me":"ot"}">${esc(m.tx)}</div>`).join("");el.scrollTop=el.scrollHeight}
const save=ref=>{const{visto,ultMsgC,leidoP,ultCons,...r}=cur;cur.prof=cur.prof||auth.currentUser.uid;cur.profNombre=cur.profNombre||PN;
 return ref.set({...r,prof:cur.prof,profNombre:cur.profNombre,upd:Date.now()},{merge:true})};
function draw(ref){
 app.innerHTML=`<button class="s" id="bk">← Clientes</button>`+hdr(esc(cur.nombre||"Cliente nuevo"),"Profe: "+esc(cur.profNombre||PN))+`
 <div class="cd">${[["nombre","Nombre"],["cel","Celular con código de país (ej. 5493415551234)"],["objetivo","Objetivo"],["profNombre","Profe responsable (lo ve el alumno)"],["pin","PIN del alumno (opcional)"]].map(([k,l])=>`<label>${l}</label><input data-p="${k}" value="${esc(cur[k])}">`).join("")}</div>
 ${cur.days.map((d,i)=>`<div class="cd"><input data-dt="${i}" value="${esc(d.t)}" style="font-weight:700">${d.ex.map((x,j)=>`<div class="exe"><input data-d="${i}" data-e="${j}" data-f="n" placeholder="Ejercicio" value="${esc(x.n)}"><div class="row"><input data-d="${i}" data-e="${j}" data-f="s" placeholder="Series" value="${esc(x.s)}"><input data-d="${i}" data-e="${j}" data-f="r" placeholder="Reps" value="${esc(x.r)}"><input data-d="${i}" data-e="${j}" data-f="p" placeholder="Pausa" value="${esc(x.p)}"><button class="x" data-rx="${i},${j}">✕</button></div></div>`).join("")}<button class="s" data-ax="${i}">+ Ejercicio</button> <button class="x" data-rd="${i}">Quitar día</button></div>`).join("")}
 <button class="s" id="ad">+ Día</button>
 <div style="margin:12px 0"><button id="sv">Guardar</button> <button class="s" id="sh">Enviar al alumno</button></div><div id="shp"></div>
 ${cur.upd&&due(cur)?`<div class="cd" style="border-color:var(--go)"><b>🔔 Pasó 1 mes</b><div class="mu">Preguntale cómo viene con la rutina.</div><button id="cq">Enviar consulta al chat</button> <button class="s" id="cw">Por WhatsApp</button></div>`:""}
 <div class="cd"><b>Seguimiento</b><div id="lg"></div></div>
 <div class="cd"><b>Chat</b><div id="ch"></div><div class="row"><input id="mt" placeholder="Mensaje"><button id="ms">Enviar</button></div></div>
 <button class="x" id="dl">Eliminar cliente</button>`;
 paintLg();paintM("p");
 const consulta=()=>`Hola ${cur.nombre}! Soy ${cur.profNombre||PN}. ¿Cómo venís con la rutina? ¿Cómo te sentís, necesitás cambiar algo?`;
 app.oninput=e=>{const t=e.target,d=t.dataset;if(d.p)cur[d.p]=t.value;else if(d.dt!==undefined)cur.days[d.dt].t=t.value;else if(d.f)cur.days[d.d].ex[d.e][d.f]=t.value};
 app.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  try{
  if(b.id==="bk")return coachHome();
  if(d.ax!==undefined){cur.days[d.ax].ex.push({n:"",s:"",r:"",p:""});return draw(ref)}
  if(d.rx){const[i,j]=d.rx.split(",");cur.days[i].ex.splice(j,1);return draw(ref)}
  if(d.rd!==undefined){cur.days.splice(d.rd,1);return draw(ref)}
  if(b.id==="ad"){cur.days.push({t:"Día "+(cur.days.length+1),ex:[]});return draw(ref)}
  if(b.id==="sv"){await save(ref);toast("✔ Guardado")}
  if(b.id==="sh"){await save(ref);const link=base()+"#c="+cur.id,msg=`Hola ${cur.nombre}! Tu rutina de ${cur.profNombre||PN} está acá: ${link}`+(cur.pin?` (PIN: ${cur.pin})`:"");
   $("#shp").innerHTML=`<div class="cd"><a class="bt" target="_blank" rel="noopener" href="https://wa.me/${(cur.cel||"").replace(/\D/g,"")}?text=${encodeURIComponent(msg)}">Enviar por WhatsApp</a> <button class="s" id="cp">Copiar mensaje</button></div>`;
   $("#cp").onclick=()=>navigator.clipboard.writeText(msg).then(()=>toast("Copiado"))}
  if(b.id==="cw"){window.open(`https://wa.me/${(cur.cel||"").replace(/\D/g,"")}?text=${encodeURIComponent(consulta()+" Respondeme por acá o en la app: "+base()+"#c="+cur.id)}`,"_blank");cur.ultCons=Date.now();await ref.update({ultCons:cur.ultCons});draw(ref)}
  if(b.id==="cq"){cur.ultCons=Date.now();await ref.collection("msgs").add({from:"p",by:PN,tx:consulta(),t:Date.now()});await ref.update({ultCons:cur.ultCons});toast("Consulta enviada al chat");draw(ref)}
  if(b.id==="ms"){const v=$("#mt").value.trim();if(v){$("#mt").value="";await ref.collection("msgs").add({from:"p",by:PN,tx:v,t:Date.now()})}}
  if(b.id==="dl"){if(delArm!==cur.id){delArm=cur.id;b.textContent="¿Seguro? Tocá otra vez";setTimeout(()=>{delArm=null;b.textContent="Eliminar cliente"},6000);return}
   delArm=null;await delClient(cur.id);coachHome()}
  }catch(err){toast("Error: "+err.message)}}}

function clientView(id){rst();logs=[];msgs=[];let tch=false;const ref=db.collection("clients").doc(id);
 sub(ref.onSnapshot(s=>{if(!s.exists){app.innerHTML="<p>Este link no es válido. Pedile uno nuevo a tu profe.</p>";return}
  cur=s.data();cur.id=id;const cl=isCoach(auth.currentUser);
  if(!tch&&!cl){tch=true;if(Date.now()-(cur.visto||0)>6*36e5)ref.update({visto:Date.now()}).catch(()=>{})}
  if(cur.pin&&unl!==id&&!cl)pinView();else cview(ref)},e=>app.innerHTML="<p>No se pudo cargar: "+esc(e.message)+"</p>"));
 sub(ref.collection("logs").orderBy("t","desc").limit(300).onSnapshot(s=>{logs=s.docs.map(d=>d.data());paintLast()},()=>{}));
 sub(ref.collection("msgs").orderBy("t").onSnapshot(s=>{msgs=s.docs.map(d=>d.data());paintM("c")},()=>{}))}
function pinView(){app.onclick=app.oninput=app.onchange=null;
 app.innerHTML=hdr("Tu rutina","Profe: "+esc(cur.profNombre||""))+`<div class="cd"><p class="mu">Ingresá el PIN que te dio tu profe.</p><input id="pn" inputmode="numeric" placeholder="PIN"><button id="pg">Entrar</button><div id="pe" class="mu" style="color:var(--rd)"></div></div>`;
 const go=()=>{if($("#pn").value.trim()===String(cur.pin)){unl=cur.id;cview(db.collection("clients").doc(cur.id))}else $("#pe").textContent="PIN incorrecto"};
 $("#pg").onclick=go;$("#pn").onkeydown=e=>{if(e.key==="Enter")go()}}
const dk=()=>"bh:"+cur.id+":"+new Date().toLocaleDateString("sv-SE");
const ld=()=>{try{return JSON.parse(localStorage.getItem(dk())||"{}")}catch(e){return{}}};
const sd=o=>{try{localStorage.setItem(dk(),JSON.stringify(o))}catch(e){}};
function cview(ref){const done=ld();
 app.innerHTML=hdr("Hola "+esc(cur.nombre),"Profe: "+esc(cur.profNombre||""))+`<p class="mu">${esc(cur.objetivo||"")}</p>
 ${cur.days.map((d,i)=>`<div class="cd"><b>${esc(d.t)}</b>${d.ex.map((x,j)=>{const k=i+"-"+j;return `<div class="ex2${done[k]?" done":""}"><b class="nm">${esc(x.n)}</b> <span class="mu">${esc(x.s)} × ${esc(x.r)}${x.p?" · Pausa "+esc(x.p):""}</span>
  <div class="mu" data-last="${k}"></div>
  <label class="ok"><input type="checkbox" data-ck="${k}"${done[k]?" checked":""}> Hecho</label>
  <div class="row"><input type="number" inputmode="decimal" placeholder="kg" id="k${k}"><input type="number" inputmode="numeric" placeholder="reps" id="r${k}"><button data-sv="${k}">Guardar</button></div></div>`}).join("")}</div>`).join("")}
 <div class="cd"><b>Chat con tu profe</b><div id="ch"></div><div class="row"><input id="mt" placeholder="Escribí un mensaje"><button id="ms">Enviar</button></div></div>`;
 paintLast();paintM("c");
 app.onchange=e=>{const t=e.target,k=t.dataset.ck;if(!k)return;const o=ld();o[k]=t.checked;sd(o);t.closest(".ex2").classList.toggle("done",t.checked)};
 app.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  try{
  if(d.sv){const[i,j]=d.sv.split("-"),k=$("#k"+d.sv).value,r=$("#r"+d.sv).value;if(!k&&!r)return;
   await ref.collection("logs").add({n:cur.days[i].ex[j].n,kg:k,reps:r,t:Date.now()});$("#k"+d.sv).value=$("#r"+d.sv).value="";toast("✔ Guardado")}
  if(b.id==="ms"){const v=$("#mt").value.trim();if(v){$("#mt").value="";await ref.collection("msgs").add({from:"c",tx:v,t:Date.now()});ref.update({ultMsgC:Date.now()}).catch(()=>{})}}
  }catch(err){toast("Error: "+err.message)}}}
function paintLast(){app.querySelectorAll("[data-last]").forEach(el=>{const[i,j]=el.dataset.last.split("-"),x=cur.days&&cur.days[i]&&cur.days[i].ex[j],l=x&&logs.find(l=>l.n===x.n);
 el.textContent=l?`Última vez: ${l.kg||"-"} kg × ${l.reps||"-"} (${new Date(l.t).toLocaleDateString("es-AR")})`:""})}
</script></body></html>
