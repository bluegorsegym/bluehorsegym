<style>
:root{--bg:#f4f6fb;--tx:#14213d;--mu:#667085;--cd:#fff;--bd:#d6dbe6;--ac:#1d4ed8;--rd:#d92d20;--go:#c8921a}
@media(prefers-color-scheme:dark){:root{--bg:#0d1424;--tx:#e8ecf5;--mu:#97a0b3;--cd:#161f35;--bd:#2a3550;--ac:#6b93ff;--rd:#ff7b72;--go:#f0b84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.hd img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#000;flex:none}
.hd div{min-width:0}
h1{font:800 24px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.3px}
h1 em{color:var(--go);font-style:normal}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input,textarea{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button,a.bt{display:inline-block;padding:10px 14px;border:1px solid var(--ac);border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;margin:3px 0;text-decoration:none;cursor:pointer}
button.s{background:transparent;color:var(--ac)}
button.x{background:transparent;color:var(--rd);border-color:var(--rd)}
.mu{color:var(--mu);font-size:14px}
label{font-size:14px;color:var(--mu)}
.row{display:flex;gap:6px;align-items:center}.row input{margin:0}
.exe{padding:6px 0;border-top:1px solid var(--bd)}.exe>input{margin:2px 0 6px}
.ex2{padding:10px 0;border-top:1px solid var(--bd)}.ex2 .row{margin-top:6px}
.ex2.done .nm{text-decoration:line-through;opacity:.55}
.ok{display:flex;align-items:center;gap:10px;margin:8px 0 0;font-size:16px;color:var(--tx);cursor:pointer}
.ok input{width:26px;height:26px;margin:0;accent-color:var(--ac)}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;color:#fff;background:var(--ac)}
.tg.g{background:var(--go);color:#111}.tg.r{background:var(--rd)}
select{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row select{margin:0;flex:1}
.dys{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.dys button{margin:0}
.pb{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.pb i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
a.bt.s{background:transparent;color:var(--ac)}
.b{padding:8px 12px;border-radius:14px;margin:4px 0;max-width:85%;width:fit-content}
.me{background:var(--ac);color:#fff;margin-left:auto}.ot{background:var(--bd)}
#ch{max-height:240px;overflow:auto;margin-bottom:8px}
#tt{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;max-width:90%}
</style></head><body>
<div id="app"><p class="mu">Cargando…</p></div><div id="tt"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAHeWt3yOcpGx8UacxHr5HJPlN7FA2feQQ",authDomain:"bluehorse-gym.firebaseapp.com",projectId:"bluehorse-gym",storageBucket:"bluehorse-gym.firebasestorage.app",messagingSenderId:"240476420168",appId:"1:240476420168:web:133e368e1930e0daca807d"});
const sec=firebase.initializeApp(firebase.app().options,"sec");
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s),app=$("#app");
const ADMIN="guillegori760@gmail.com";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nz=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const fn=c=>String(c.apodo||"").trim()||String(c.nombre||"").trim().split(/\s+/)[0]||"";
const LOGO=$("#ic").href;document.head.insertAdjacentHTML("beforeend",`<link rel="apple-touch-icon" href="${LOGO}">`);
const hdr=(t,s)=>`<div class="hd"><img src="${LOGO}" alt=""><div><h1>${t}</h1>${s?`<div class="mu">${s}</div>`:""}</div></div>`;
const big=(t,s)=>`<div style="text-align:center;margin:18px 0 20px"><img src="${LOGO}" alt="" style="width:104px;height:104px;border-radius:22px;object-fit:cover;background:#000;box-shadow:0 6px 20px rgba(0,0,0,.25)"><h1 style="margin-top:12px;font-size:30px">${t}</h1>${s?`<div class="mu" style="margin-top:4px">${s}</div>`:""}</div>`;
let U=[],cur={},unl=null,delArm=null,logs=[],msgs=[],ROLE=null,PN="",F="all",PL=[],CL=[],PF="all",selDay=-1,G={};
const DAY=864e5,dias=c=>(Date.now()-(c.visto||c.desde||0))/DAY,ina=c=>dias(c)>=60,due=c=>(Date.now()-(c.ultCons||c.desde||0))/DAY>=30,unr=c=>(c.ultMsgC||0)>(c.leidoP||0);
const clr=()=>{U.forEach(u=>u());U=[]},sub=u=>U.push(u);
const rst=()=>{clr();app.onclick=app.oninput=app.onchange=null};
function toast(m){const t=$("#tt");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3000)}
const hashId=()=>(location.hash.match(/^#c=([\w-]+)/)||[])[1];
const isCoach=u=>u&&!u.isAnonymous;
const base=()=>location.href.split("#")[0];
function route(u){clr();const id=hashId();
 if(id){if(!u)auth.signInAnonymously().catch(e=>app.innerHTML="<p>No se pudo conectar: "+esc(e.message)+"</p>");else clientView(id)}
 else if(isCoach(u))enter(u);else login()}
auth.onAuthStateChanged(route);window.onhashchange=()=>route(auth.currentUser);
async function enter(u){ROLE=null;
 if((u.email||"").toLowerCase()===ADMIN){ROLE="admin";PN="Administrador"}
 else{try{const s=await db.collection("profs").doc(u.uid).get();if(s.exists){ROLE="prof";PN=s.data().nombre}}catch(e){}}
 if(ROLE)return coachHome();
 rst();app.innerHTML=hdr("Sin acceso")+`<div class="cd"><p>Tu usuario todavía no tiene permiso. Pedile acceso al administrador.</p><button class="s" id="out">Salir</button></div>`;$("#out").onclick=()=>auth.signOut()}

function login(){rst();
 app.innerHTML=big("Blue Horse <em>Gym</em>","Ingreso de profes")+`<div class="cd"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="go">Entrar</button> <button class="s" id="fg">Olvidé mi contraseña</button><div id="er" class="mu" style="color:var(--rd)"></div></div>`;
 $("#go").onclick=()=>auth.signInWithEmailAndPassword($("#em").value.trim(),$("#pw").value).catch(()=>$("#er").textContent="Email o contraseña incorrectos.");
 $("#fg").onclick=()=>{const e=$("#em").value.trim();if(!e)return toast("Escribí tu email arriba");auth.sendPasswordResetEmail(e).then(()=>toast("Te enviamos un email para cambiarla")).catch(x=>toast(x.message))}}

async function delClient(id){const ref=db.collection("clients").doc(id),r=[];
 for(const n of["logs","msgs"])(await ref.collection(n).get()).forEach(x=>r.push(x.ref));r.push(ref);
 for(let i=0;i<r.length;i+=400){const bt=db.batch();r.slice(i,i+400).forEach(x=>bt.delete(x));await bt.commit()}}

function coachHome(){rst();let cl=[];const adm=ROLE==="admin",view=()=>adm&&PF!=="all"?cl.filter(c=>(c.prof||"")===PF):cl;
 app.innerHTML=hdr("Mis clientes",esc(PN)+(adm?" · Admin":""))+`${adm?'<select id="fp"></select>':""}<div id="st" class="mu"></div><div id="fl" style="margin:8px 0"></div><button id="nw">+ Nuevo cliente</button> ${adm?'<button class="s" id="pf">Profes</button> ':""}<button class="s" id="bp">Copia (CSV)</button><input id="sq" placeholder="Buscar cliente" autocomplete="off" style="margin-top:10px"><div id="ls"></div><button class="s" id="out">Salir</button>`;
 const paint=()=>{const pm={};cl.forEach(c=>{pm[c.prof||""]=c.profNombre||"Sin profe"});if(PF!=="all"&&!pm[PF])PF="all";
  if(adm)$("#fp").innerHTML='<option value="all">Todos los profes ('+cl.length+')</option>'+Object.entries(pm).sort((a,b)=>String(a[1]).localeCompare(String(b[1]))).map(([u,n])=>`<option value="${esc(u)}"${PF===u?" selected":""}>${esc(n)} (${cl.filter(c=>(c.prof||"")===u).length})</option>`).join("");
  const bl=view(),a=bl.filter(c=>!ina(c)).length,i=bl.length-a,d=bl.filter(due).length,v=nz($("#sq").value);
  $("#st").textContent=`Rutinas: ${bl.length} · Activas: ${a} · Inactivas (+60 días sin abrir): ${i}`;
  $("#fl").innerHTML=[["all","Todos"],["act","Activas"],["ina","Inactivas ("+i+")"],["due","🔔 Consultar ("+d+")"]].map(([k,l])=>`<button class="${F===k?"":"s"}" data-f="${k}">${l}</button>`).join(" ")+(F==="ina"&&i?` <button class="x" id="pg">Eliminar las ${i} inactivas</button>`:"");
  const L=bl.filter(c=>(F==="all"||(F==="act"&&!ina(c))||(F==="ina"&&ina(c))||(F==="due"&&due(c)))&&(!v||nz([c.nombre,c.apodo,c.objetivo,c.cel,c.profNombre].join(" ")).includes(v))).sort((x,y)=>String(x.nombre).localeCompare(String(y.nombre)));
  $("#ls").innerHTML=L.map(c=>`<div class="cd" data-o="${esc(c.id)}" style="cursor:pointer"><b>${esc(c.nombre||"(sin nombre)")}</b>${due(c)?'<span class="tg g">🔔 Consultar</span>':""}${ina(c)?'<span class="tg r">💤 '+Math.floor(dias(c))+' días</span>':""}${unr(c)?'<span class="tg">💬 Nuevo</span>':""}<div class="mu">${esc(c.objetivo||"")}${adm?" · Profe: "+esc(c.profNombre||"-"):""}</div></div>`).join("")||'<p class="mu">No hay clientes en esta vista.</p>'};
 const q=adm?db.collection("clients"):db.collection("clients").where("prof","==",auth.currentUser.uid);
 sub(q.onSnapshot(s=>{cl=s.docs.map(d=>({...d.data(),id:d.id}));CL=cl;paint()},e=>toast(e.message)));
 $("#sq").oninput=paint;
 if(adm)$("#fp").onchange=e=>{PF=e.target.value;delArm=null;paint()};
 $("#nw").onclick=()=>editor(db.collection("clients").doc().id);
 $("#out").onclick=()=>auth.signOut();
 if(adm)$("#pf").onclick=profsView;
 $("#bp").onclick=async()=>{const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';const rows=["Cliente,Fecha,Ejercicio,Kg,Reps"];
  for(const c of cl){const s=await db.collection("clients").doc(c.id).collection("logs").orderBy("t").get();s.forEach(d=>{const l=d.data();rows.push([c.nombre,new Date(l.t).toISOString().slice(0,10),l.n,l.kg,l.reps].map(q).join(","))})}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv"}));a.download="bluehorse-backup.csv";a.click()};
 app.onclick=async e=>{const b=e.target.closest("button"),c=e.target.closest("[data-o]");
  if(b&&b.dataset.f){F=b.dataset.f;delArm=null;return paint()}
  if(b&&b.id==="pg"){const n=view().filter(ina);if(delArm!=="pg"){delArm="pg";b.textContent="¿Seguro? Se borran "+n.length+". Tocá otra vez";return}
   delArm=null;try{for(const x of n)await delClient(x.id);toast("Eliminadas "+n.length)}catch(err){toast(err.message)}return}
  if(!b&&c)editor(c.dataset.o)}}

function profsView(){rst();let ps=[],cx=[];
 app.innerHTML=`<button class="s" id="bk">← Clientes</button>`+hdr("Profes","Acceso para crear rutinas")+`<div class="cd"><b>Nuevo profe</b><input id="pn1" placeholder="Nombre"><input id="pe1" type="email" placeholder="Email"><input id="pw1" placeholder="Contraseña (mínimo 6)"><button id="mk">Crear profe</button><div id="mr"></div></div><div id="pl"></div>`;
 const paintP=()=>{const me=auth.currentUser.uid,act=ps.filter(p=>!p.arch),arc=ps.filter(p=>p.arch),op=ex=>[{uid:me,nombre:"Administrador (yo)"},...act].filter(x=>x.uid!==ex).map(x=>`<option value="${esc(x.uid)}">${esc(x.nombre)}</option>`).join("");
  $("#pl").innerHTML=act.map(p=>{const m=cx.filter(c=>c.prof===p.uid);return `<div class="cd"><b>${esc(p.nombre)}</b><div class="mu">${esc(p.email)} · ${m.length} clientes · ${m.filter(c=>!ina(c)).length} activos</div><div class="row" style="margin:8px 0"><select data-to="${esc(p.uid)}">${op(p.uid)}</select><button class="s" data-mv="${esc(p.uid)}">Pasar sus clientes</button></div><button class="x" data-rp="${esc(p.uid)}">Quitar acceso</button></div>`}).join("")||'<p class="mu">Todavía no hay profes.</p>';
  if(arc.length)$("#pl").innerHTML+='<div class="mu" style="margin:14px 0 6px">Sin acceso (sus clientes siguen guardados)</div>'+arc.map(p=>`<div class="cd"><b>${esc(p.nombre)}</b><div class="mu">${esc(p.email)} · ${cx.filter(c=>c.prof===p.uid).length} clientes</div><button class="s" data-ra="${esc(p.uid)}">Reactivar</button></div>`).join("")};

const dk=()=>"bh:"+cur.id+":"+new Date().toLocaleDateString("sv-SE");
const ld=()=>{try{return JSON.parse(localStorage.getItem(dk())||"{}")}catch(e){return{}}};
const sd=o=>{try{localStorage.setItem(dk(),JSON.stringify(o))}catch(e){}};
const vid=x=>{const v=String(x.v||"").trim();return /^https?:\/\//i.test(v)?v:"https://www.youtube.com/results?search_query="+encodeURIComponent((x.n||"")+" ejercicio técnica")};
function chart(n){const p=logs.filter(l=>l.n===n&&!isNaN(parseFloat(l.kg))).sort((a,b)=>a.t-b.t).map(l=>({t:l.t,v:parseFloat(l.kg)}));
 if(p.length<2)return '<div class="mu">Cargá al menos 2 registros de peso para ver tu evolución.</div>';
 const W=300,H=110,pd=24,mn=Math.min(...p.map(x=>x.v)),mx=Math.max(...p.map(x=>x.v)),r=mx-mn||1,t0=p[0].t,t1=p[p.length-1].t,tr=t1-t0||1,X=t=>pd+(W-2*pd)*(t-t0)/tr,Y=v=>H-pd-(H-2*pd)*(v-mn)/r,f=t=>new Date(t).toLocaleDateString("es-AR");
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de tus kilos"><polyline points="${p.map(x=>X(x.t).toFixed(1)+","+Y(x.v).toFixed(1)).join(" ")}" fill="none" style="stroke:var(--ac)" stroke-width="2.5"/>${p.map(x=>`<circle cx="${X(x.t).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="3.5" style="fill:var(--ac)"/>`).join("")}<text x="4" y="${Y(mx)+4}" font-size="10" style="fill:var(--mu)">${mx}</text><text x="4" y="${Y(mn)+4}" font-size="10" style="fill:var(--mu)">${mn}</text><text x="${pd}" y="${H-6}" font-size="10" style="fill:var(--mu)">${f(t0)}</text><text x="${W-pd}" y="${H-6}" font-size="10" text-anchor="end" style="fill:var(--mu)">${f(t1)}</text></svg><div class="mu">Kilos registrados</div>`}
function paintG(){app.querySelectorAll("[data-gr]").forEach(el=>{const k=el.dataset.gr,[i,j]=k.split("-"),x=cur.days&&cur.days[i]&&cur.days[i].ex[j];el.style.display=G[k]?"":"none";if(G[k]&&x)el.innerHTML=chart(x.n)})}
function sm(){const d=cur.days&&cur.days[selDay];if(!d||!$("#sm"))return;const done=ld(),n=d.ex.filter((_,j)=>done[selDay+"-"+j]).length;
 $("#sm").textContent="Hechos hoy: "+n+" de "+d.ex.length;$("#pbi").style.width=(d.ex.length?n/d.ex.length*100:0)+"%";
 app.querySelectorAll("[data-dy]").forEach(b=>{const i=+b.dataset.dy,dd=cur.days[i];b.textContent=dd.t+(dd.ex.length&&dd.ex.every((_,j)=>done[i+"-"+j])?" ✓":"")})}
function cview(ref){const done=ld();
 if(selDay<0){try{selDay=+(localStorage.getItem("bh:day:"+cur.id)||0)}catch(e){selDay=0}}
 if(!cur.days[selDay])selDay=0;
 const i=selDay,d=cur.days[i]||{t:"",ex:[]};
 app.innerHTML=hdr("¡Hola "+esc(fn(cur))+"!","Profe: "+esc(cur.profNombre||""))+`<p class="mu">${esc(cur.objetivo||"")}</p>
 <div class="dys">${cur.days.map((x,k)=>`<button class="${k===i?"":"s"}" data-dy="${k}">${esc(x.t)}</button>`).join("")}</div>
 <div class="cd"><b>${esc(d.t)}</b><div class="mu" id="sm"></div><div class="pb"><i id="pbi"></i></div>
 ${d.ex.map((x,j)=>{const k=i+"-"+j;return `<div class="ex2${done[k]?" done":""}"><b class="nm">${esc(x.n)}</b> <span class="mu">${esc(x.s)} × ${esc(x.r)}${x.p?" · Pausa "+esc(x.p):""}</span>
  <div class="mu" data-last="${k}"></div>
  <label class="ok"><input type="checkbox" data-ck="${k}"${done[k]?" checked":""}> Hecho</label>
  <div class="row"><input type="number" inputmode="decimal" placeholder="kg" id="k${k}"><input type="number" inputmode="numeric" placeholder="reps" id="r${k}"><button data-sv="${k}">Guardar</button></div>
  <div class="row" style="margin-top:6px"><button class="s" data-g="${k}">📈 Mi evolución</button><a class="bt s" target="_blank" rel="noopener" href="${esc(vid(x))}">▶ Cómo se hace</a></div>
  <div data-gr="${k}" style="display:none"></div></div>`}).join("")||'<p class="mu">Este día todavía no tiene ejercicios.</p>'}</div>
 <div class="cd"><b>Chat con tu profe</b><div id="ch"></div><div class="row"><input id="mt" placeholder="Escribí un mensaje"><button id="ms">Enviar</button></div></div>`;
 paintLast();paintM("c");sm();
 app.onchange=e=>{const t=e.target,k=t.dataset.ck;if(!k)return;const o=ld();o[k]=t.checked;sd(o);t.closest(".ex2").classList.toggle("done",t.checked);sm()};
 app.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  try{
  if(d.dy!==undefined){selDay=+d.dy;try{localStorage.setItem("bh:day:"+cur.id,selDay)}catch(x){}return cview(ref)}
  if(d.g){G[d.g]=!G[d.g];return paintG()}
  if(d.sv){const[i,j]=d.sv.split("-"),k=$("#k"+d.sv).value,r=$("#r"+d.sv).value;if(!k&&!r)return;
   await ref.collection("logs").add({n:cur.days[i].ex[j].n,kg:k,reps:r,t:Date.now()});$("#k"+d.sv).value=$("#r"+d.sv).value="";toast("✔ Guardado")}
  if(b.id==="ms"){const v=$("#mt").value.trim();if(v){$("#mt").value="";await ref.collection("msgs").add({from:"c",tx:v,t:Date.now()});ref.update({ultMsgC:Date.now()}).catch(()=>{})}}
  }catch(err){toast("Error: "+err.message)}}}
function paintLast(){app.querySelectorAll("[data-last]").forEach(el=>{const[i,j]=el.dataset.last.split("-"),x=cur.days&&cur.days[i]&&cur.days[i].ex[j],l=x&&logs.find(l=>l.n===x.n);
 el.textContent=l?`Última vez: ${l.kg||"-"} kg × ${l.reps||"-"} (${new Date(l.t).toLocaleDateString("es-AR")})`:""});paintG()}
</script></body></html>
